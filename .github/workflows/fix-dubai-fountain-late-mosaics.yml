name: Fix Dubai fountain late mosaics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dubai-fountain-late-mosaics.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Add missing late privacy mosaics
        shell: bash
        run: |
          set -euo pipefail
          src="public/videos/actual/dubai-fountain-2012.mp4"
          out="public/videos/actual/dubai-fountain-2012.fixed.mp4"

          test -s "$src"
          before_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src")"

          # The supplied reference video already contains the desired privacy edits.
          # The existing site file already has the early ~13-15s mosaic. This pass only restores
          # the later mosaics missing from the prior replacement: ~51-54s and ~88-89.5s.
          ffmpeg -y -loglevel error -i "$src" \
            -filter_complex "[0:v]split=9[b0][c1][c2][c3][c4][c5][c6][c7][c8];[c1]crop=200:210:480:210,scale=20:21:flags=area,scale=200:210:flags=neighbor[p1];[b0][p1]overlay=480:210:enable='between(t,50.70,51.25)'[b1];[c2]crop=210:220:315:180,scale=21:22:flags=area,scale=210:220:flags=neighbor[p2];[b1][p2]overlay=315:180:enable='between(t,51.25,52.20)'[b2];[c3]crop=250:250:345:130,scale=25:25:flags=area,scale=250:250:flags=neighbor[p3];[b2][p3]overlay=345:130:enable='between(t,52.20,52.80)'[b3];[c4]crop=350:350:260:90,scale=35:35:flags=area,scale=350:350:flags=neighbor[p4];[b3][p4]overlay=260:90:enable='between(t,52.80,53.30)'[b4];[c5]crop=320:420:400:40,scale=32:42:flags=area,scale=320:420:flags=neighbor[p5];[b4][p5]overlay=400:40:enable='between(t,53.30,53.90)'[b5];[c6]crop=370:470:0:0,scale=37:47:flags=area,scale=370:470:flags=neighbor[p6];[b5][p6]overlay=0:0:enable='between(t,87.60,88.20)'[b6];[c7]crop=560:480:0:0,scale=56:48:flags=area,scale=560:480:flags=neighbor[p7];[b6][p7]overlay=0:0:enable='between(t,88.20,89.20)'[b7];[c8]crop=300:470:0:0,scale=30:47:flags=area,scale=300:470:flags=neighbor[p8];[b7][p8]overlay=0:0:enable='between(t,89.20,89.50)'[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset medium -crf 26 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart "$out"

          after_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$out")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$out")"
          vcodec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")"
          acodec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")"

          python - "$before_duration" "$after_duration" <<'PY'
          import sys
          before = float(sys.argv[1])
          after = float(sys.argv[2])
          if abs(before - after) > 0.15:
              raise SystemExit(f"duration changed too much: {before} -> {after}")
          PY

          test "$width" = "720"
          test "$height" = "480"
          test "$vcodec" = "h264"
          test -n "$acodec"
          test "$(stat -c%s "$out")" -gt 5000000

          mv "$out" "$src"
          echo "Duration: $after_duration sec"
          echo "Final size: $(stat -c%s "$src") bytes"

      - name: Commit corrected video only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/fix-dubai-fountain-late-mosaics.yml
          git add public/videos/actual/dubai-fountain-2012.mp4

          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort | tr '\n' ' ')" = ".github/workflows/fix-dubai-fountain-late-mosaics.yml public/videos/actual/dubai-fountain-2012.mp4 "

          git commit -m "Restore missing late mosaics in Dubai fountain video"
          git push origin HEAD:main
