name: Replace Dubai fountain video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-dubai-fountain-video.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Create face-mosaicked replacement video
        shell: bash
        run: |
          set -euo pipefail
          src="public/videos/actual/dubai-fountain-2012.mp4"
          out="public/videos/actual/dubai-fountain-2012.new.mp4"

          test -s "$src"
          before_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src")"

          # Privacy edit based on the face-mosaicked replacement supplied for this recording.
          # Only the short foreground face/head interval is pixelated; the article and media URL stay unchanged.
          ffmpeg -y -loglevel error -i "$src" \
            -filter_complex "[0:v]split=7[b0][c1][c2][c3][c4][c5][c6];[c1]crop=260:260:400:190,scale=26:26:flags=area,scale=260:260:flags=neighbor[p1];[b0][p1]overlay=400:190:enable='between(t,13.25,13.55)'[b1];[c2]crop=260:260:300:100,scale=26:26:flags=area,scale=260:260:flags=neighbor[p2];[b1][p2]overlay=300:100:enable='between(t,13.55,13.80)'[b2];[c3]crop=270:230:130:80,scale=27:23:flags=area,scale=270:230:flags=neighbor[p3];[b2][p3]overlay=130:80:enable='between(t,13.80,14.15)'[b3];[c4]crop=280:230:100:80,scale=28:23:flags=area,scale=280:230:flags=neighbor[p4];[b3][p4]overlay=100:80:enable='between(t,14.15,14.45)'[b4];[c5]crop=300:240:170:80,scale=30:24:flags=area,scale=300:240:flags=neighbor[p5];[b4][p5]overlay=170:80:enable='between(t,14.45,14.70)'[b5];[c6]crop=280:240:280:100,scale=28:24:flags=area,scale=280:240:flags=neighbor[p6];[b5][p6]overlay=280:100:enable='between(t,14.70,14.90)'[v]" \
            -map "[v]" -map 0:a? \
            -c:v libx264 -preset medium -crf 26 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart "$out"

          after_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$out")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$out")"
          vcodec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")"
          acodec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")"

          python - "$before_duration" "$after_duration" <<'PY'
          import sys
          before = float(sys.argv[1])
          after = float(sys.argv[2])
          if abs(before - after) > 0.15:
              raise SystemExit(f"duration changed too much: {before} -> {after}")
          PY

          test "$width" = "720"
          test "$height" = "480"
          test "$vcodec" = "h264"
          test -n "$acodec"
          test "$(stat -c%s "$out")" -gt 5000000

          mv "$out" "$src"
          echo "Replacement duration: $after_duration sec"
          echo "Replacement size: $(stat -c%s "$src") bytes"

      - name: Commit only the replacement video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/replace-dubai-fountain-video.yml
          git add public/videos/actual/dubai-fountain-2012.mp4

          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort | tr '\n' ' ')" = ".github/workflows/replace-dubai-fountain-video.yml public/videos/actual/dubai-fountain-2012.mp4 "

          git commit -m "Replace Dubai fountain video with face-mosaicked version"
          git push origin HEAD:main
