name: Live site smoke check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-live-site.mjs
      - scripts/check-christmas-image-live.mjs
      - src/data/media-privacy-reviews.json
      - src/content/posts/abu-dhabi-evening-beach-2012.md
      - src/content/posts/abu-dhabi-water-delivery-2014.md
      - public/images/actual/**/*mosaic*.webp
      - .github/workflows/live-site-smoke.yml

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check live production readiness
        run: node scripts/check-live-site.mjs

      - name: Check corrected Christmas image live
        run: node scripts/check-christmas-image-live.mjs
