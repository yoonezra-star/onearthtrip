name: Normalize audited links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize audited links
        run: node scripts/normalize-audited-links.mjs

      - name: Commit normalized links
        run: |
          if git diff --quiet -- src; then
            echo "No audited links needed normalization."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Normalize audited internal links"
          git push
