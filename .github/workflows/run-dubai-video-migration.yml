name: Run Dubai video migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-dubai-video-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run migration
        run: node scripts/migrate-dubai-video-external.mjs

      - name: Commit migration result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serve exact Dubai mosaic video outside Pages assets'
          git push
