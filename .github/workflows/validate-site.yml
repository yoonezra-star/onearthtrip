name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check internal links
        run: npm run check:links

      - name: Check images
        run: npm run check:images

      - name: Check article media
        run: npm run check:media

      - name: Check media privacy inventory
        run: npm run check:media-privacy

      - name: Check field-note trust
        run: npm run check:field-notes

      - name: Check guide sources and freshness
        run: npm run check:guide-sources

      - name: Check core story SEO metadata
        run: npm run check:seo

      - name: Check static sitemap coverage
        run: npm run check:sitemap

      - name: Audit AdSense content readiness
        run: npm run audit:adsense

      - name: Build Astro site
        run: npm run build

      - name: Check all indexable sitemap pages
        run: npm run check:indexable-pages

      - name: Check indexable crawl graph
        run: npm run check:crawl-graph

      - name: Check AdSense reviewer path
        run: npm run check:review-path

      - name: Check AdSense page boundaries
        run: npm run check:adsense-pages

      - name: Check final AdSense approval readiness
        run: npm run check:adsense-ready

      - name: Upload privacy review candidates
        uses: actions/upload-artifact@v4
        with:
          name: privacy-review-candidates
          if-no-files-found: error
          retention-days: 1
          path: |
            public/images/actual/abu-dhabi-cultural-performance-2012.webp
            public/images/actual/abu-dhabi-korean-community-space-2015.webp
            public/images/actual/abu-dhabi-neighborhood-playground-2019.webp
            public/images/actual/abu-dhabi-shaded-playground-2019.webp
            public/images/actual/abu-dhabi-hotel-buffet-2019.webp
            public/images/actual/abu-dhabi-hotel-event-room-2014.webp
            public/images/actual/abu-dhabi-hotel-outdoor-pool-2014.webp
            public/images/actual/abu-dhabi-hotel-restaurant-2014.webp
            public/images/actual/grand-mosque-visitor-flow-2012.webp
            public/images/actual/national-aquarium-entrance.webp
