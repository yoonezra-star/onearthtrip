name: Replace Dubai fountain video with browser-safe H264

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-dubai-video-h264.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified H264 video
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p public/videos/actual
          gdown 'https://drive.google.com/uc?id=1zenS6SRPGHQ29LiqrdThq0T3KAoSwsao&export=download' -O public/videos/actual/dubai-fountain-2012-mosaic-v4.mp4
          test "$(stat -c%s public/videos/actual/dubai-fountain-2012-mosaic-v4.mp4)" -eq 24426606
          echo 'f1094d954aca3d3488489d2469e21e4a9e5ed8ea1b9475d4e3bf8f3c2dea4d30  public/videos/actual/dubai-fountain-2012-mosaic-v4.mp4' | sha256sum -c -

      - name: Switch page to local H264 asset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          post = Path('src/content/posts/dubai-burj-khalifa-2012.md')
          text = post.read_text(encoding='utf-8')
          text = text.replace('/videos/actual/dubai-fountain-2012-mosaic-v3.mp4', '/videos/actual/dubai-fountain-2012-mosaic-v4.mp4')
          post.write_text(text, encoding='utf-8')

          redirects = Path('public/_redirects')
          lines = redirects.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if not line.startswith('/videos/actual/dubai-fountain-2012-mosaic-v3.mp4 ')]
          redirects.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          media = Path('scripts/check-media.mjs')
          text = media.read_text(encoding='utf-8')
          text = text.replace('media/dubai-fountain-2012-mosaic-v3.mp4', 'public/videos/actual/dubai-fountain-2012-mosaic-v4.mp4')
          text = text.replace('/videos/actual/dubai-fountain-2012-mosaic-v3.mp4', '/videos/actual/dubai-fountain-2012-mosaic-v4.mp4')
          text = text.replace('64463666', '24426606')
          text = text.replace('fbadd3e1b653a83083467f03603c271e76c60f633a6f1f0f79a7307c7b824632', 'f1094d954aca3d3488489d2469e21e4a9e5ed8ea1b9475d4e3bf8f3c2dea4d30')
          media.write_text(text, encoding='utf-8')

          live = Path('scripts/check-live-site.mjs')
          text = live.read_text(encoding='utf-8')
          text = text.replace('/videos/actual/dubai-fountain-2012-mosaic-v3.mp4', '/videos/actual/dubai-fountain-2012-mosaic-v4.mp4')
          text = text.replace('64463666', '24426606')
          live.write_text(text, encoding='utf-8')
          PY
          rm -f media/dubai-fountain-2012-mosaic-v3.mp4
          git rm .github/workflows/replace-dubai-video-h264.yml

      - name: Commit browser-safe video setup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serve Dubai mosaic video as browser-safe H264'
          git push
