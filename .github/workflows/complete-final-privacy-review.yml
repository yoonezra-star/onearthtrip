name: Complete final privacy review inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-final-privacy-review.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Record final manual privacy reviews
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path('src/data/media-privacy-reviews.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          media = manifest['media']
          reviewed = {
              '/images/actual/abu-dhabi-flame-tree-road.webp': 'Manual visual review found a tree-lined road scene; vehicles and any distant people are too small for personal identification.',
              '/images/actual/abu-dhabi-flame-tree.webp': 'Manual visual review found the flowering tree and park setting with no identifiable person or readable vehicle identifier.',
              '/images/actual/sir-bani-yas-road-2021.webp': 'Manual visual review found an empty coastal road and Sir Bani Yas sign with no identifiable people or readable vehicle identifiers.',
              '/images/actual/uae-zoo-giraffe-2014.webp': 'Manual visual review found giraffes and enclosure structures with no people visible.',
              '/images/actual/uae-zoo-zebras-2014.webp': 'Manual visual review found zebras and enclosure structures with no people visible.',
              '/images/actual/yas-island-hotel-district-2014.webp': 'Manual visual review found a high-angle hotel-district view; vehicles and any people are too distant for identification and no plate is readable.',
              '/images/actual/yas-island-morning-view-2014.webp': 'Manual visual review found a high-angle Yas Island road and hotel view with no identifiable person or readable vehicle identifier.',
              '/videos/actual/sir-bani-yas-coastal-road-2021.mp4': 'Manual visual review sampled 56 frames at one-second intervals across the 56.49-second video. No face is visible; one passing vehicle plate is unreadable, and the brief windshield sticker/permit remains blurred and unreadable.',
          }

          for media_path, note in reviewed.items():
              if media_path not in media:
                  raise SystemExit(f'missing privacy manifest entry: {media_path}')
              media[media_path] = {
                  'status': 'reviewed',
                  'reviewedDate': '2026-08-30',
                  'note': note,
              }

          remaining = [p for p, entry in media.items() if entry.get('status') == 'needs-review']
          if remaining:
              raise SystemExit('needs-review entries remain: ' + ', '.join(remaining))

          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/complete-final-privacy-review.yml

      - name: Validate completed privacy inventory
        run: npm run check:media-privacy

      - name: Commit completed privacy inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete first-party media privacy review inventory'
          git push origin HEAD:main
