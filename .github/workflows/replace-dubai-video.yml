name: Replace Dubai fountain video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-dubai-video.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download exact user-provided mosaic video
        run: |
          python -m pip install --disable-pip-version-check gdown
          rm -f public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4
          gdown 'https://drive.google.com/uc?id=1Zg4gyI4FUWiZ9KgtldkYk55szzkWwXTC&export=download' -O public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4
          test "$(stat -c%s public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4)" -eq 64463666
          echo 'fbadd3e1b653a83083467f03603c271e76c60f633a6f1f0f79a7307c7b824632  public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4' | sha256sum -c -

      - name: Commit exact replacement video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4
          git commit -m 'Add exact user-provided Dubai fountain mosaic video'
          git push
