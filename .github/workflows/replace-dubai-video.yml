name: Replace Dubai fountain video

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-dubai-video.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify exact user-provided video already in repository
        run: |
          test "$(stat -c%s public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4)" -eq 64463666
          echo 'fbadd3e1b653a83083467f03603c271e76c60f633a6f1f0f79a7307c7b824632  public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4' | sha256sum -c -

      - name: Point article to exact video and remove stale assets
        run: |
          python - <<'PY'
          from pathlib import Path
          post = Path('src/content/posts/dubai-burj-khalifa-2012.md')
          text = post.read_text(encoding='utf-8')
          old = '/videos/actual/dubai-fountain-2012-mosaic-v2.mp4'
          new = '/videos/actual/dubai-fountain-2012-mosaic-v3.mp4'
          if old not in text:
              raise SystemExit(f'Expected old video path not found: {old}')
          post.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f public/videos/actual/dubai-fountain-2012-mosaic-v2.mp4
          git rm .github/workflows/replace-dubai-video.yml

      - name: Commit final exact replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/dubai-burj-khalifa-2012.md public/videos/actual/dubai-fountain-2012-mosaic-v2.mp4
          git commit -m 'Use exact user-provided Dubai fountain mosaic video'
          git push
