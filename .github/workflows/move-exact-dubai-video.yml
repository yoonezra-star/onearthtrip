name: Move exact Dubai video outside Pages assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-exact-dubai-video.yml

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Move exact video and update references
        run: |
          set -euo pipefail
          SOURCE='public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4'
          DEST='media/dubai-fountain-2012-mosaic-v3.mp4'
          RAW='https://raw.githubusercontent.com/yoonezra-star/onearthtrip/main/media/dubai-fountain-2012-mosaic-v3.mp4'
          test "$(stat -c%s "$SOURCE")" -eq 64463666
          echo 'fbadd3e1b653a83083467f03603c271e76c60f633a6f1f0f79a7307c7b824632  public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4' | sha256sum -c -
          mkdir -p media
          mv "$SOURCE" "$DEST"
          python - <<'PY'
          from pathlib import Path

          raw = 'https://raw.githubusercontent.com/yoonezra-star/onearthtrip/main/media/dubai-fountain-2012-mosaic-v3.mp4'

          post = Path('src/content/posts/dubai-burj-khalifa-2012.md')
          text = post.read_text(encoding='utf-8')
          old = '/videos/actual/dubai-fountain-2012-mosaic-v3.mp4'
          if old not in text:
              raise SystemExit(f'Article source not found: {old}')
          text = text.replace(old, raw, 1)
          post.write_text(text, encoding='utf-8')

          media = Path('scripts/check-media.mjs')
          text = media.read_text(encoding='utf-8')
          text = text.replace(
              'const exactDubaiVideo = "public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4";',
              'const exactDubaiVideo = "media/dubai-fountain-2012-mosaic-v3.mp4";\nconst exactDubaiVideoSource = "https://raw.githubusercontent.com/yoonezra-star/onearthtrip/main/media/dubai-fountain-2012-mosaic-v3.mp4";'
          )
          old_block = '''      const filePath = await requirePublicFile(src, "/videos/", label, "video");
      if (filePath) referencedVideos.add(filePath);'''
          new_block = '''      let filePath;
      if (src === exactDubaiVideoSource) {
        filePath = resolve(root, exactDubaiVideo);
        try {
          await stat(filePath);
        } catch {
          issues.push(`${label}: missing exact external Dubai video source file ${exactDubaiVideo}`);
          filePath = undefined;
        }
      } else {
        filePath = await requirePublicFile(src, "/videos/", label, "video");
      }
      if (filePath) referencedVideos.add(filePath);'''
          if old_block not in text:
              raise SystemExit('Expected check-media source block not found')
          text = text.replace(old_block, new_block, 1)
          media.write_text(text, encoding='utf-8')

          live = Path('scripts/check-live-site.mjs')
          text = live.read_text(encoding='utf-8')
          text = text.replace(
              'const dubaiMosaicVideoPath = "/videos/actual/dubai-fountain-2012-mosaic-v3.mp4";',
              'const dubaiMosaicVideoUrl = "https://raw.githubusercontent.com/yoonezra-star/onearthtrip/main/media/dubai-fountain-2012-mosaic-v3.mp4";'
          )
          text = text.replace(
              '      test: (html) => html.includes(`src=\\"${dubaiMosaicVideoPath}\\"`)\n        || html.includes(`src=\'${dubaiMosaicVideoPath}\'`)',
              '      test: (html) => html.includes(`src=\\"${dubaiMosaicVideoUrl}\\"`)\n        || html.includes(`src=\'${dubaiMosaicVideoUrl}\'`)'
          )
          text = text.replace(
              '  `${canonicalOrigin}${dubaiMosaicVideoPath}`,\n  "Dubai fountain mosaic video",',
              '  dubaiMosaicVideoUrl,\n  "Dubai fountain mosaic video",'
          )
          text = text.replace(
              '    if (!contentType.toLowerCase().includes("video/mp4")) {\n      fail(`${label}: expected video/mp4, got ${contentType || "no content-type"}.`);\n      return;\n    }',
              '    const normalizedType = contentType.toLowerCase();\n    if (!normalizedType.includes("video/mp4") && !normalizedType.includes("application/octet-stream")) {\n      fail(`${label}: expected video/mp4 or application/octet-stream, got ${contentType || "no content-type"}.`);\n      return;\n    }'
          )
          if 'dubaiMosaicVideoPath' in text:
              raise SystemExit('Stale dubaiMosaicVideoPath reference remains in live check')
          live.write_text(text, encoding='utf-8')
          PY
          test "$(stat -c%s "$DEST")" -eq 64463666
          echo 'fbadd3e1b653a83083467f03603c271e76c60f633a6f1f0f79a7307c7b824632  media/dubai-fountain-2012-mosaic-v3.mp4' | sha256sum -c -
          git rm .github/workflows/test-github-video-stream.yml
          git rm .github/workflows/move-exact-dubai-video.yml

      - name: Commit deployment-safe exact video setup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/dubai-fountain-2012-mosaic-v3.mp4 public/videos/actual/dubai-fountain-2012-mosaic-v3.mp4 src/content/posts/dubai-burj-khalifa-2012.md scripts/check-media.mjs scripts/check-live-site.mjs
          git commit -m 'Serve exact Dubai mosaic video outside Pages assets'
          git push
