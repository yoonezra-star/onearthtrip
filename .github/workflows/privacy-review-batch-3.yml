name: Privacy review batch 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-review-batch-3.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload third privacy review batch
        uses: actions/upload-artifact@v4
        with:
          name: privacy-review-batch-3
          retention-days: 1
          if-no-files-found: error
          path: |
            public/images/actual/abu-dhabi-beach-mosque-2012.webp
            public/images/actual/abu-dhabi-high-rise-view-2021.webp
            public/images/actual/abu-dhabi-highway-sunset-2014.webp
            public/images/actual/abu-dhabi-hotel-ballroom-2014.webp
            public/images/actual/abu-dhabi-hotel-bathroom-2014.webp
            public/images/actual/abu-dhabi-hotel-ceiling-2012.webp
            public/images/actual/abu-dhabi-hotel-evening-lights-2019.webp
            public/images/actual/abu-dhabi-water-truck-2014.webp
            public/images/actual/burj-khalifa-day-2012.webp
            public/images/actual/burj-khalifa-night-2012.webp
            public/images/actual/dubai-fountain-video-2012.webp
            public/images/actual/desert-dune-pause-2012.webp
            public/images/actual/desert-livestock-enclosure-2012.webp
            public/images/actual/dune-camel.webp
            public/images/actual/grand-mosque-exterior.webp
            public/images/actual/grand-mosque-floral-window.webp
            public/images/actual/grand-mosque-night.webp
