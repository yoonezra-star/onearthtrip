name: Privacy review batch 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-review-batch-2.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload privacy review batch
        uses: actions/upload-artifact@v4
        with:
          name: privacy-review-batch-2
          retention-days: 1
          if-no-files-found: error
          path: |
            public/images/actual/abu-dhabi-hotel-buffet-2019.webp
            public/images/actual/abu-dhabi-hotel-indoor-pool-2014.webp
            public/images/actual/abu-dhabi-hotel-room-2014.webp
            public/images/actual/abu-dhabi-immersive-exhibit-2021.webp
            public/images/actual/abu-dhabi-rooftop-pool-city-2014.webp
            public/images/actual/abu-dhabi-evening-beach-2012.webp
            public/images/actual/abu-dhabi-waterfront-night-2012.webp
            public/images/actual/national-aquarium-reef.webp
            public/images/actual/national-aquarium-sharks.webp
            public/images/actual/camel-farm.webp
            public/images/actual/uae-zoo-bird-enclosure-2014.webp
