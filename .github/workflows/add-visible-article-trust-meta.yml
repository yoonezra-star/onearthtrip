name: Add visible article trust metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-visible-article-trust-meta.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add author and publication labels to article header
        run: |
          python - <<'PY'
          from pathlib import Path

          layout = Path('src/layouts/PostLayout.astro')
          text = layout.read_text(encoding='utf-8')
          old = '''        <time datetime={post.data.pubDate.toISOString()}>{formatDate(post.data.pubDate)}</time>
        {post.data.updatedDate && (
          <span>수정 {formatDate(post.data.updatedDate)}</span>
        )}
        <span>{readingTime}분 읽기</span>'''
          new = '''        <a class="meta-author" href="/author" rel="author">작성 {post.data.author}</a>
        <span>게시 <time datetime={post.data.pubDate.toISOString()}>{formatDate(post.data.pubDate)}</time></span>
        {post.data.updatedDate && (
          <span>수정 {formatDate(post.data.updatedDate)}</span>
        )}
        <span>{readingTime}분 읽기</span>'''
          if old not in text:
              raise SystemExit('Expected PostLayout metadata block not found')
          text = text.replace(old, new, 1)

          css_anchor = '''<style>\n  .content-basis {'''
          css_replacement = '''<style>\n  .meta-author {\n    color: inherit;\n    font-weight: 800;\n    text-decoration: none;\n  }\n\n  .meta-author:hover {\n    text-decoration: underline;\n  }\n\n  .content-basis {'''
          if css_anchor not in text:
              raise SystemExit('Expected PostLayout style anchor not found')
          text = text.replace(css_anchor, css_replacement, 1)
          layout.write_text(text, encoding='utf-8')

          reviewer = Path('scripts/check-adsense-review-path.mjs')
          text = reviewer.read_text(encoding='utf-8')
          anchor = '''const fieldNotesHtml = readRoute("/field-notes");'''
          block = '''const representativeArticleRoutes = [\n  "/2026/08/uae-entry-checklist-before-travel",\n  "/2026/08/abu-dhabi-3-day-itinerary",\n  "/2026/08/sheikh-zayed-grand-mosque-visit-guide",\n  "/2026/04/blog-post_11"\n];\n\nfor (const route of representativeArticleRoutes) {\n  const html = readRoute(route);\n  if (!html.includes('rel="author"')) {\n    violations.push(`${route}: expected visible rel=author link in article header metadata`);\n  }\n  if (!html.includes('>작성 ') || !html.includes('>게시 <time')) {\n    violations.push(`${route}: expected explicit author and publication labels in article header metadata`);\n  }\n}\n\nconst fieldNotesHtml = readRoute("/field-notes");'''
          if anchor not in text:
              raise SystemExit('Expected reviewer-path insertion anchor not found')
          text = text.replace(anchor, block, 1)
          reviewer.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/add-visible-article-trust-meta.yml

      - name: Commit article trust metadata improvement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clarify visible article author and publication metadata'
          git push
